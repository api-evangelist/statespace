name: Statespace
description: 'Statespace is the company behind Aimlabs (aimlabs.com, formerly statespace.gg),
  the leading AI-powered aim-training platform for FPS gamers. Aimlabs delivers personalized
  training tasks, real-time performance analytics, and game-specific tools, serving over
  40 million players and operating as an official partner of Valorant and Rainbow Six
  Siege. Statespace is venture-backed by Bessemer Venture Partners and Lux Capital. As
  of this enrichment pass the company publishes a consumer web/desktop product but no
  public developer API, SDK, or documentation surface.'
